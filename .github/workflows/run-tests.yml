name: Run All Tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cross-platform
            os: ubuntu-latest
            solution: Scrubbler.CrossPlatform.slnf
          - name: Windows-only plugins
            os: windows-latest
            solution: Scrubbler.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "${{ matrix.solution }}" -c Release
        working-directory: Scrubbler

      - name: Test
        run: dotnet test "${{ matrix.solution }}" -c Release --no-build --verbosity normal
        working-directory: Scrubbler
